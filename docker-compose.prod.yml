# Production stack: the app and PostgreSQL.
#
#   1. Copy .env.example to .env.production and fill it in (JWT_SECRET at least).
#   2. Set POSTGRES_PASSWORD in your shell or in a .env file next to this one.
#   3. docker compose -f docker-compose.prod.yml up -d --build
#
# Migrations run automatically when the app container starts.
# For a managed database (RDS, Neon, Supabase), delete the postgres service
# and set DATABASE_URL in .env.production instead.

services:
  app:
    build: .
    image: societyops-ai:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://societyops:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/societyops?schema=public
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Only used by the local storage driver. Set S3_BUCKET for real storage.
      - uploads:/app/uploads

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: societyops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: societyops
    # No published port: only the app reaches the database.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U societyops -d societyops']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  uploads:
